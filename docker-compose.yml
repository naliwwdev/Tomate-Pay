version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tomatepay_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tomatepay
      MYSQL_USER: tomatepay
      MYSQL_PASSWORD: tomatepay_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tomatepay_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomatepay_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: tomatepay
      DB_PASSWORD: tomatepay_secure_password
      DB_NAME: tomatepay
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - tomatepay_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tomatepay_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - tomatepay_network

volumes:
  mysql_data:

networks:
  tomatepay_network:
    driver: bridge
